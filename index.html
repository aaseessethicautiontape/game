<meta name="bumbleton-code" content="BUMBLE-GQQPDKJD">
<title>Wet Paint Sign</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Work+Sans:wght@400;600&display=swap">
<style>
  /* Layout: one hand-painted plank on a wall, centered, with a paint canvas behind the lettering */
  :root {
    --wall: #e9ecef;
    --board: #fffdf6;
    --ink: #1d2433;
    --muted: #5b6577;
    --edge: #c9cfd8;
    --paint-1: #f2b705;
    --paint-2: #1e6fd9;
    --paint-3: #e2483d;
    --font-display: "Bowlby One", "Arial Black", Impact, sans-serif;
    --font-body: "Work Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --wall: #151a22; --board: #222a36; --ink: #f3f1ea; --muted: #a9b2c2; --edge: #3a4454;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --wall: #151a22; --board: #222a36; --ink: #f3f1ea; --muted: #a9b2c2; --edge: #3a4454;
    color-scheme: dark;
  }

  html, body { min-height: 100%; }
  body {
    background: var(--wall);
    color: var(--ink);
    font-family: var(--font-body);
    display: grid;
    place-items: center;
    min-height: 100vh;
    padding-block: 32px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    box-sizing: border-box;
  }

  .sign {
    position: relative;
    width: 100%;
    max-width: 720px;
    background: var(--board);
    border: 2px solid var(--edge);
    border-radius: 6px;
    box-shadow: 0 18px 40px -20px rgb(0 0 0 / 0.45);
    overflow: hidden;
    transform: rotate(-1.2deg);
  }
  .sign canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  .content {
    position: relative;
    display: grid;
    gap: 18px;
    justify-items: start;
    padding: clamp(28px, 6vw, 56px);
  }
  .eyebrow {
    margin: 0;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  h1 {
    margin: 0;
    font-family: var(--font-display);
    font-weight: 400;
    font-size: clamp(3.2rem, 14vw, 7.5rem);
    line-height: 0.88;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }
  h1 span { color: var(--paint-3); }
  .note {
    margin: 0;
    max-width: 40ch;
    font-size: 1.05rem;
    line-height: 1.5;
    color: var(--muted);
  }
  button {
    font: 600 1rem var(--font-body);
    color: #1d2433;
    background: var(--paint-1);
    border: 2px solid #1d2433;
    border-radius: 999px;
    padding: 12px 22px;
    cursor: pointer;
    box-shadow: 3px 3px 0 #1d2433;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
  }
  button:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 #1d2433; }
  button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #1d2433; }
  button:focus-visible { outline: 3px solid var(--paint-2); outline-offset: 3px; }
  .count { font-size: 0.85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  @media (prefers-reduced-motion: reduce) { button { transition: none; } }
</style>

<main class="sign" aria-labelledby="heading">
  <canvas id="paint" aria-hidden="true"></canvas>
  <div class="content">
    <p class="eyebrow">Caution · Bench drying until 5 pm</p>
    <h1 id="heading">Wet<br><span>Paint</span></h1>
    <p class="note">Two coats of Sunflower Yellow, applied this morning. Please don't sit, lean or test it with a finger.</p>
    <button id="splash" type="button">Add a splash</button>
    <p class="count" id="count" aria-live="polite">3 splashes so far</p>
  </div>
</main>

<script>
  const canvas = document.getElementById('paint');
  const ctx = canvas.getContext('2d');
  const colors = () => {
    const s = getComputedStyle(document.documentElement);
    return ['--paint-1', '--paint-2', '--paint-3'].map(v => s.getPropertyValue(v).trim());
  };
  let splashes = [];

  function makeSplash(x, y, color) {
    const r = 18 + Math.random() * 34;
    const blobs = Array.from({ length: 7 + Math.floor(Math.random() * 6) }, () => {
      const a = Math.random() * Math.PI * 2, d = r * (0.6 + Math.random() * 1.2);
      return { dx: Math.cos(a) * d, dy: Math.sin(a) * d, r: 2 + Math.random() * r * 0.25 };
    });
    const drip = Math.random() < 0.6 ? 30 + Math.random() * 90 : 0;
    return { x, y, r, color, blobs, drip };
  }

  function resize() {
    const box = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = box.width * dpr;
    canvas.height = box.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    draw();
  }

  function draw() {
    const w = canvas.width / (window.devicePixelRatio || 1);
    const h = canvas.height / (window.devicePixelRatio || 1);
    ctx.clearRect(0, 0, w, h);
    ctx.globalAlpha = 0.85;
    for (const s of splashes) {
      const x = s.x * w, y = s.y * h;
      ctx.fillStyle = s.color;
      ctx.beginPath(); ctx.arc(x, y, s.r, 0, Math.PI * 2); ctx.fill();
      for (const b of s.blobs) { ctx.beginPath(); ctx.arc(x + b.dx, y + b.dy, b.r, 0, Math.PI * 2); ctx.fill(); }
      if (s.drip) {
        const dw = s.r * 0.3;
        ctx.fillRect(x - dw / 2, y, dw, s.drip);
        ctx.beginPath(); ctx.arc(x, y + s.drip, dw * 0.75, 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  const [c1, c2, c3] = colors();
  splashes = [makeSplash(0.86, 0.18, c1), makeSplash(0.72, 0.78, c2), makeSplash(0.08, 0.92, c3)];

  let total = 3;
  document.getElementById('splash').addEventListener('click', () => {
    const palette = colors();
    splashes.push(makeSplash(0.05 + Math.random() * 0.9, 0.05 + Math.random() * 0.8,
      palette[Math.floor(Math.random() * palette.length)]));
    if (splashes.length > 40) splashes.shift();
    total++;
    document.getElementById('count').textContent = total + ' splashes so far';
    draw();
  });

  new ResizeObserver(resize).observe(canvas);
  resize();
</script>
